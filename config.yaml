# LiteLLM proxy config.
# Docs: https://docs.litellm.ai/docs/proxy/configs (verified current Sep 2026)
#
# model_name values here MUST match the keys under provider.litellm.models
# in opencode.jsonc, and LANGGRAPH_MODEL in .env, so that OpenCode and the
# langgraph-agent MCP server are asking LiteLLM for the same aliases.

model_list:
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      tpm: 400000
      rpm: 4000

  - model_name: gpt-5.2
    litellm_params:
      model: openai/gpt-5.2
      api_key: os.environ/OPENAI_API_KEY
      tpm: 400000
      rpm: 4000

  - model_name: azure-gpt-5-mini
    litellm_params:
      model: azure/gpt-5-mini-deployment # your Azure deployment name
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION

router_settings:
  routing_strategy: usage-based-routing-v2
  # If Claude Sonnet 4.5 is rate-limited or unavailable, fail over to
  # Azure GPT-5 mini rather than surfacing an error to the coding agent.
  fallbacks:
    - claude-sonnet-4-5: ["azure-gpt-5-mini"]
    - gpt-5.2: ["azure-gpt-5-mini"]
  num_retries: 2
  timeout: 120
  allowed_fails: 3
  cooldown_time: 30

litellm_settings:
  drop_params: true
  # Optional response caching (needs the redis service in docker-compose.yml).
  # Uncomment once REDIS_HOST/PORT are reachable.
  # cache: true
  # cache_params:
  #   type: redis
  #   host: os.environ/REDIS_HOST
  #   port: os.environ/REDIS_PORT
  #   ttl: 900

  # Optional observability -- send every call to Langfuse. Requires
  # LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY in the environment.
  # success_callback: ["langfuse"]
  # failure_callback: ["langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Enables persistent virtual keys, per-key budgets, and spend tracking
  # in the LiteLLM UI/DB. Point this at the postgres service below, or
  # remove it to run key-less/stateless.
  database_url: os.environ/DATABASE_URL
  allow_user_auth: false
